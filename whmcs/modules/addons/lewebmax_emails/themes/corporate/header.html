<!-- LEWEBMAX — Thème « Corporate » — En-tête
     Style lettre officielle : filet bleu en tête de carte, coordonnées à droite. -->
%%doc_start%%
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f5fb" class="lwm-bg" style="background-color:#f4f5fb;">
  <tr>
    <td align="center" style="padding:28px 12px;">
      <table role="presentation" class="lwm-container" width="620" cellpadding="0" cellspacing="0" border="0" style="width:620px;max-width:620px;">
        <tr>
          <td bgcolor="#ffffff" class="lwm-surface" style="background-color:#ffffff;border:1px solid #e2e5f2;border-top:6px solid #030673;border-radius:6px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="lwm-pad" style="padding:28px 44px 22px 44px;border-bottom:1px solid #e2e5f2;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="left" valign="middle">%%logo_on_light%%</td>
                      <td align="right" valign="middle" class="lwm-hide-mobile" style="font-family:Plus Jakarta Sans,Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8a8ea8;">
                        <strong style="color:#0d0d2b;">%%company%%</strong><br>
                        %%address%%<br>
                        <a href="%%site_url%%" target="_blank" style="color:#030673;text-decoration:none;">%%site_label%%</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td class="lwm-card" style="padding:38px 44px 34px 44px;font-family:Plus Jakarta Sans,Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#575b78;">
