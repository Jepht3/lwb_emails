<!-- LEWEBMAX — Thème « Moderne » — En-tête
     Grand bandeau en dégradé bleu (bleu uni sur Outlook) avec le logo blanc et une accroche. -->
%%doc_start%%
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef0fb" class="lwm-bg" style="background-color:#eef0fb;">
  <tr>
    <td align="center" style="padding:28px 12px;">
      <table role="presentation" class="lwm-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">
        <tr>
          <td bgcolor="#030673" class="lwm-pad" style="background-color:#030673;background-image:linear-gradient(135deg,#020452 0%,#030673 55%,#2a2fb8 100%);border-radius:22px 22px 0 0;padding:30px 40px 34px 40px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="left" valign="middle">%%logo_on_dark%%</td>
                <td align="right" valign="middle" class="lwm-hide-mobile">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="border:1px solid #5a5fd0;border-radius:999px;padding:7px 14px;font-family:Plus Jakarta Sans,Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;font-weight:600;color:#ffffff;">
                        <span style="color:#ff6a3d;">&#9679;</span>&nbsp; %%hero_badge%%
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td colspan="2" style="padding-top:26px;font-family:Plus Jakarta Sans,Arial,Helvetica,sans-serif;font-size:22px;line-height:30px;font-weight:800;color:#ffffff;">
                  %%hero_text%% <span style="color:#ff6a3d;">%%hero_accent%%</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td bgcolor="#ffffff" class="lwm-card" style="background-color:#ffffff;padding:40px 44px;font-family:Plus Jakarta Sans,Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#575b78;">
